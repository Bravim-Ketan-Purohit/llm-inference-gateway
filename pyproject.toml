[project]
name = "llm-inference-gateway"
version = "0.1.0"
description = "OpenAI-compatible gateway with semantic caching and speculative decoding"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",
    "sse-starlette==2.2.1",
    "redis[hiredis]==5.2.1",
    "numpy==2.2.1",
    "tiktoken==0.8.0",
    "opentelemetry-api==1.29.0",
    "opentelemetry-sdk==1.29.0",
    "opentelemetry-instrumentation-fastapi==0.50b0",
    "opentelemetry-exporter-otlp==1.29.0",
    "prometheus-client==0.21.1",
    "prometheus-fastapi-instrumentator==7.0.2",
    "boto3==1.36.2",
    "psycopg[binary]==3.2.4",
    "pgvector==0.3.6",
    "sentence-transformers==3.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-httpx==0.35.0",
    "ruff==0.8.6",
    "mypy==1.14.1",
    "httpx[http2]==0.28.1",
    "types-redis==4.6.0.20241004",
    "boto3-stubs[dynamodb]==1.36.2",
    "respx==0.22.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gateway", "bench", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "SIM117"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "pgvector.*", "tiktoken.*"]
ignore_missing_imports = true
